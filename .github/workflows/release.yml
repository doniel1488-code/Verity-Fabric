name: Release Verity Fabric

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle 8.14.3
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.14.3'

      - name: Restore source archive
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .build-src
          cat source/verity-source-part-*.b64 | base64 --decode > /tmp/verity-source.tar.xz
          xz -t /tmp/verity-source.tar.xz
          tar -xJf /tmp/verity-source.tar.xz -C .build-src
          test -f .build-src/VerityFabric/build.gradle

      - name: Build
        run: gradle --no-daemon -p .build-src/VerityFabric clean build

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: .build-src/VerityFabric/build/libs/verity-fabric-*.jar
