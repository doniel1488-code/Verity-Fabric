name: Release Verity Fabric

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    name: Build and publish tagged Verity release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout tagged source
        uses: actions/checkout@v6

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle 8.14.3
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.14.3'

      - name: Restore and validate source archive
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .build-src
          cat source/v0.2.0/verified-chunks/part-*.b64 | base64 --decode > /tmp/verity-fabric-source.tar.xz
          xz -t /tmp/verity-fabric-source.tar.xz
          tar -xJf /tmp/verity-fabric-source.tar.xz -C .build-src
          test -f .build-src/VerityFabric/build.gradle
          python .build-src/VerityFabric/scripts/verify_resources.py --project .build-src/VerityFabric

      - name: Build remapped mod
        run: gradle --no-daemon -p .build-src/VerityFabric clean build

      - name: Verify packaged JAR
        shell: bash
        run: |
          set -euo pipefail
          JAR=".build-src/VerityFabric/build/libs/verity-fabric-0.2.0.jar"
          test -f "$JAR"
          python .build-src/VerityFabric/scripts/verify_resources.py --jar "$JAR"
          mkdir -p dist
          cp "$JAR" dist/

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: "Verity ${{ github.ref_name }} — Minecraft 1.21.8"
          body: |
            ## Verity ${{ github.ref_name }} — Fabric 1.21.8

            Предварительный релиз. Сборка прошла компиляцию, remap и проверку ресурсов до и после упаковки в JAR.

            В JAR входят русская и английская локализации, иконка мода, обычная и хоррор-текстуры, модель и текстура Коробки Verity, рецепт и четыре OGG-звука.

            Требуется Minecraft Java 1.21.8, Fabric Loader, Fabric API для 1.21.8 и Java 21.
            Игровое тестирование непосредственно на клиенте Minecraft остаётся необходимым.
          files: dist/verity-fabric-0.2.0.jar
          fail_on_unmatched_files: true
          prerelease: true
