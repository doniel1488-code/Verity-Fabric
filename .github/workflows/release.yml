name: Release Verity Fabric
on:
  push:
    tags: ['v*']
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.14.3'
      - name: Extract source archive
        run: |
          mkdir -p .build-src
          tar -xJf source/Verity-Fabric-source.tar.xz -C .build-src
      - name: Build
        run: gradle --no-daemon -p .build-src/VerityFabric clean build
      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: .build-src/VerityFabric/build/libs/verity-fabric-*.jar
