name: Build Verity Fabric

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Minecraft 1.21.8 / Fabric
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle 8.14.3
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.14.3'

      - name: Restore source archive
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .build-src
          cat source/verity-source-part-*.b64 | base64 --decode > /tmp/verity-source.tar.xz
          xz -t /tmp/verity-source.tar.xz
          tar -xJf /tmp/verity-source.tar.xz -C .build-src
          test -f .build-src/VerityFabric/build.gradle

      - name: Build remapped mod
        run: gradle --no-daemon -p .build-src/VerityFabric clean build

      - name: Upload JAR
        uses: actions/upload-artifact@v7
        with:
          name: Verity-Fabric-Minecraft-1.21.8
          path: .build-src/VerityFabric/build/libs/verity-fabric-*.jar
          if-no-files-found: error
          retention-days: 30
