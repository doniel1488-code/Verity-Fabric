name: Build Verity Fabric

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Minecraft 1.21.8 / Fabric
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle 8.14.3
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.14.3'

      - name: Restore and verify source archive
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .build-src
          cat source/verity-source-part-[0-9][0-9].b64 | base64 --decode > /tmp/verity-source.tar.xz
          xz -t /tmp/verity-source.tar.xz
          tar -xJf /tmp/verity-source.tar.xz -C .build-src
          test -f .build-src/VerityFabric/build.gradle
          test -f .build-src/VerityFabric/scripts/verify_resources.py
          python .build-src/VerityFabric/scripts/verify_resources.py --project .build-src/VerityFabric

      - name: Build remapped mod
        run: gradle --no-daemon -p .build-src/VerityFabric clean build

      - name: Verify packaged resources
        shell: bash
        run: |
          set -euo pipefail
          JAR="$(find .build-src/VerityFabric/build/libs -maxdepth 1 -type f -name 'verity-fabric-*.jar' ! -name '*-sources.jar' ! -name '*-dev.jar' | head -n 1)"
          test -n "$JAR"
          python .build-src/VerityFabric/scripts/verify_resources.py --jar "$JAR"
          mkdir -p dist
          cp "$JAR" dist/

      - name: Upload release JAR
        uses: actions/upload-artifact@v7
        with:
          name: Verity-Fabric-Minecraft-1.21.8
          path: dist/verity-fabric-*.jar
          if-no-files-found: error
          retention-days: 30
