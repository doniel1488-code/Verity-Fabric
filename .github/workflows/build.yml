name: Build Verity Fabric

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Verity 0.2.0 / Minecraft 1.21.8 / Fabric
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle 8.14.3
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.14.3'

      - name: Restore and verify Verity 0.2.0 source archive
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .build-src
          cat source/v0.2.0/chunks/part-*.b64 | base64 --decode > /tmp/verity-fabric-0.2.0.tar.xz
          xz -t /tmp/verity-fabric-0.2.0.tar.xz
          tar -xJf /tmp/verity-fabric-0.2.0.tar.xz -C .build-src
          patch -p1 -d .build-src/VerityFabric < source/patches/0001-fix-1218-item-tooltip.patch
          test -f .build-src/VerityFabric/build.gradle
          test -f .build-src/VerityFabric/scripts/verify_resources.py
          python .build-src/VerityFabric/scripts/verify_resources.py --project .build-src/VerityFabric

      - name: Build remapped mod
        run: gradle --no-daemon -p .build-src/VerityFabric clean build

      - name: Verify resources inside the packaged JAR
        shell: bash
        run: |
          set -euo pipefail
          JAR=".build-src/VerityFabric/build/libs/verity-fabric-0.2.0.jar"
          test -f "$JAR"
          python .build-src/VerityFabric/scripts/verify_resources.py --jar "$JAR"
          mkdir -p dist
          cp "$JAR" dist/

      - name: Upload release JAR
        uses: actions/upload-artifact@v7
        with:
          name: Verity-Fabric-Minecraft-1.21.8
          path: dist/verity-fabric-0.2.0.jar
          if-no-files-found: error
          retention-days: 90
